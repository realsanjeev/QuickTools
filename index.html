    <!-- Synchronous dark-mode detection to prevent FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('quicktools-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages URL restoration -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === 'p') {
          var query = {};
          l.search.slice(1).split('&').forEach(function (v) {
            var item = v.split('=');
            query[item[0]] = item.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (query.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (query.p || '') +
              (query.q ? ('?' + query.q) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>

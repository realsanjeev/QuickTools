<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>QuickTools - Free Online Utility Tools | Sanjeev Bhandari (@realsanjeev)</title>
    <link rel="canonical" href="https://bhandarisanjeev.com.np/QuickTools/" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (subpath deployment: /QuickTools/)
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var preferredHostname = 'bhandarisanjeev.com.np';
      var isGithubPages = l.hostname.includes('github.io');
      var hostname = isGithubPages ? preferredHostname : l.hostname;

      l.replace(
        l.protocol + '//' + hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
